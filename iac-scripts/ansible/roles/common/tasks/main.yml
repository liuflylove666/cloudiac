---
- name: 设置时区为上海
  timezone:
    name: Asia/Shanghai

- name: 安装 EPEL 仓库（Rocky Linux 需要）
  yum:
    name: epel-release
    state: present

- name: 安装基础工具包
  yum:
    name:
      - wget
      - curl
      - vim
      - git
      - net-tools
      - htop
      - lsof
      - unzip
    state: present

- name: 关闭 SELinux
  selinux:
    state: disabled

- name: 关闭防火墙
  systemd:
    name: firewalld
    state: stopped
    enabled: no

- name: 配置 SSH 安全
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^PermitRootLogin', line: 'PermitRootLogin yes' }
    - { regexp: '^PasswordAuthentication', line: 'PasswordAuthentication no' }
  notify: restart sshd

- name: 配置系统内核参数
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: yes
  loop:
    - { name: 'net.core.somaxconn', value: '65535' }
    - { name: 'net.ipv4.tcp_max_syn_backlog', value: '65535' }
    - { name: 'vm.swappiness', value: '10' }

- name: 配置文件描述符限制
  lineinfile:
    path: /etc/security/limits.conf
    line: "{{ item }}"
  loop:
    - "* soft nofile 65535"
    - "* hard nofile 65535"