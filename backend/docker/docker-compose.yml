services:
  iac-portal:
    container_name: iac-portal
    image: "${DOCKER_REGISTRY}cloudiac/iac-portal:latest"
    platform: "${DOCKER_DEFAULT_PLATFORM:-linux/amd64}"
    build:
      context: ..
      dockerfile: docker/portal/Dockerfile
      args:
        VERSION: "${CLOUDIAC_VERSION:-}"
        COMMIT: "${CLOUDIAC_COMMIT:-docker-compose}"
    volumes:
      - type: bind
        source: ${CLOUDIAC_DEPLOY_ROOT:-/usr/yunji/cloudiac}/var
        target: /usr/yunji/cloudiac/var
      - type: bind
        source: ${CLOUDIAC_DEPLOY_ROOT:-/usr/yunji/cloudiac}/.env
        target: /usr/yunji/cloudiac/.env
    ports:
      - "9030:9030"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9030/api/v1/check >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  ct-runner:
    container_name: ct-runner
    image: "${DOCKER_REGISTRY}cloudiac/ct-runner:latest"
    platform: "${DOCKER_DEFAULT_PLATFORM:-linux/amd64}"
    build:
      context: ..
      dockerfile: docker/runner/Dockerfile
      args:
        VERSION: "${CLOUDIAC_VERSION:-}"
        COMMIT: "${CLOUDIAC_COMMIT:-docker-compose}"
        WORKER_IMAGE: "${DOCKER_REGISTRY}cloudiac/ct-worker:latest"
    volumes:
      - type: bind
        source: ${CLOUDIAC_DEPLOY_ROOT:-/usr/yunji/cloudiac}/var
        target: /usr/yunji/cloudiac/var
      - type: bind
        source: ${CLOUDIAC_DEPLOY_ROOT:-/usr/yunji/cloudiac}/.env
        target: /usr/yunji/cloudiac/.env
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    ports:
      - "19030:19030"
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:19030/api/v1/check >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  iac-web:
    container_name: iac-web
    image: "${DOCKER_REGISTRY}cloudiac/iac-web:latest"
    platform: "${DOCKER_DEFAULT_PLATFORM:-linux/amd64}"
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - 80:80
    restart: always
    depends_on:
      iac-portal:
        condition: service_healthy

  ct-worker:
    profiles:
      - image-build
    image: "${DOCKER_REGISTRY}cloudiac/ct-worker:latest"
    platform: "${DOCKER_DEFAULT_PLATFORM:-linux/amd64}"
    build:
      context: ..
      dockerfile: docker/worker/Dockerfile

  mysql:
    container_name: mysql
    image: "mysql:8.0"
    platform: "${DOCKER_DEFAULT_PLATFORM:-linux/amd64}"
    command: [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--sql_mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    ]
    volumes:
      - type: bind
        source: ${CLOUDIAC_DEPLOY_ROOT:-/usr/yunji/cloudiac}/var/mysql
        target: /var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_USER
      - MYSQL_PASSWORD
      - MYSQL_DATABASE
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: always

  consul:
    container_name: consul
    image: "hashicorp/consul:1.22"
    platform: "${DOCKER_DEFAULT_PLATFORM:-linux/amd64}"
    volumes:
      - type: bind
        source: ${CLOUDIAC_DEPLOY_ROOT:-/usr/yunji/cloudiac}/var/consul
        target: /consul/data
    ports:
      - "8500:8500"
    command: >
      consul agent -server -bootstrap-expect=1 -ui -bind=0.0.0.0
      -client=0.0.0.0 -enable-script-checks=true -data-dir=/consul/data
    healthcheck:
      test: ["CMD-SHELL", "consul members >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always
